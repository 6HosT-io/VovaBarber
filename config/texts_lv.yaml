  ✅ Pieprasījums nosūtīts!
  Frizieris drīz apstiprinās vai piedāvās citu laiku.
  Mēs rakstīsim jums šeit.

slot_taken: |
  Diemžēl šis laiks jau ir aizņemts 😔
