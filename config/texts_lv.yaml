  Labrīt! ☀️
  Šodien jums ir pieraksts plkst. *{time}*.
  Gaidām jūs!
  Adrese: {location}

confirm_buttons:
  yes: "✅ Jā, būšu"
  no: "❌ Vajag pārcelt"

admin_new_request: |
  🆕 Jauns pieprasījums #{id}
  Klients: {name}
  Tālrunis: {phone}
